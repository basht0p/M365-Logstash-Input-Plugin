<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="logstash-input-microsoft365">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="0.55" stop-color="#0f2f57"/>
      <stop offset="1" stop-color="#0a4a5c"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="18" fill="url(#grid)"/>

  <!-- event cards -->
  <g transform="translate(84 78)">
    <rect x="24" y="0" width="124" height="44" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <rect x="12" y="46" width="124" height="44" rx="9" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.8"/>
    <rect x="0" y="92" width="124" height="44" rx="9" fill="#ffffff" fill-opacity="0.10" stroke="#2dd4bf"/>
    <circle cx="44" cy="22" r="6" fill="#8b5cf6"/>
    <rect x="58" y="16" width="70" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.6"/>
    <rect x="58" y="26" width="46" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.35"/>
    <circle cx="32" cy="68" r="6" fill="#38bdf8"/>
    <rect x="46" y="62" width="70" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.6"/>
    <rect x="46" y="72" width="52" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.35"/>
    <circle cx="20" cy="114" r="6" fill="#2dd4bf"/>
    <rect x="34" y="108" width="70" height="5" rx="2.5" fill="#e2e8f0" fill-opacity="0.75"/>
    <rect x="34" y="118" width="40" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.4"/>
  </g>

  <!-- data flow -->
  <path d="M236 146 C 290 146, 300 110, 360 110" fill="none" stroke="url(#flow)" stroke-width="3"/>
  <path d="M236 146 C 290 146, 300 182, 360 182" fill="none" stroke="url(#flow)" stroke-width="3"/>
  <path d="M236 146 H 360" fill="none" stroke="url(#flow)" stroke-width="3"/>
  <circle cx="360" cy="110" r="5" fill="#38bdf8"/>
  <circle cx="360" cy="146" r="5" fill="#2dd4bf"/>
  <circle cx="360" cy="182" r="5" fill="#38bdf8"/>

  <!-- title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="404" y="128" fill="#ffffff" font-size="50" font-weight="700" letter-spacing="-0.5">logstash-input-<tspan fill="#38bdf8">microsoft365</tspan></text>
    <text x="406" y="172" fill="#cbd5e1" font-size="21">Microsoft 365 audit, Entra identity &amp; Defender events — straight into Logstash.</text>
    <g font-size="15" font-weight="600" fill="#e2e8f0">
      <rect x="406" y="200" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="481" y="220" text-anchor="middle">Activity API</text>
      <rect x="568" y="200" width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="648" y="220" text-anchor="middle">Microsoft Graph</text>
      <rect x="740" y="200" width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="796" y="220" text-anchor="middle">ECS v8</text>
      <rect x="864" y="200" width="200" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="964" y="220" text-anchor="middle">At-least-once recovery</text>
    </g>
  </g>
</svg>

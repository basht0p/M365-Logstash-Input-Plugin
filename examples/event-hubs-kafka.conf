# Companion pipeline only. This plugin does not consume Event Hubs directly.
# Requires the separately installed Logstash Kafka input plugin and an Event
# Hubs namespace configured with its Kafka endpoint.
input {
  kafka {
    bootstrap_servers => "${EVENTHUBS_NAMESPACE}.servicebus.windows.net:9093"
    topics => ["${EVENTHUBS_TOPIC}"]
    group_id => "logstash-m365-events"
    security_protocol => "SASL_SSL"
    sasl_mechanism => "PLAIN"
    sasl_jaas_config => "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$ConnectionString\" password=\"${EVENTHUBS_CONNECTION_STRING}\";"
    codec => json
  }
}

output {
  opensearch {
    hosts => ["https://opensearch.example:9200"]
    index => "m365-event-hubs-%{+yyyy.MM.dd}"
    user => "${OS_USER}"
    password => "${OS_PASSWORD}"
    ssl => true
  }
}

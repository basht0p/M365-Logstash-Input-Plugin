name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release tagged v<gemspec version> from main
        type: boolean
        default: false

permissions:
  contents: read

env:
  # A pushed v* tag, or a manual run on main with "release" checked, publishes the tested artifacts.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main') }}

jobs:
  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Test tenant helper
        shell: pwsh
        run: Invoke-Pester -Path scripts/tests/Initialize-M365LogstashTenant.Tests.ps1 -CI
      - name: Lint tenant helper
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $findings = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -IncludeRule PSAvoidAssignmentToAutomaticVariable)
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings.Count -gt 0) { throw 'Assignment to a PowerShell automatic variable.' }

  logstash:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        logstash: ['8.19.22', '9.5.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Vendor pinned Java dependencies
        run: mvn -B dependency:copy-dependencies
      - name: Build offline gem
        id: gem
        run: |
          gem build logstash-input-microsoft365.gemspec
          echo "version=$(ruby -e 'print Gem::Specification.load("logstash-input-microsoft365.gemspec").version')" >> "$GITHUB_OUTPUT"
      - name: Test plugin under Logstash
        shell: bash
        env:
          PLUGIN_VERSION: ${{ steps.gem.outputs.version }}
        run: |
          set -euo pipefail
          container="m365-ci-${{ matrix.logstash }}-${{ github.run_id }}"
          offline_container="${container}-offline"
          trap 'docker rm -f "$container" "$offline_container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" --user root --entrypoint sleep -v "$PWD:/work" -w /work "docker.elastic.co/logstash/logstash:${{ matrix.logstash }}" infinity
          docker exec -e JAVA_HOME=/usr/share/logstash/jdk "$container" /usr/share/logstash/vendor/jruby/bin/jruby -S gem install rspec -v 3.13.0 --no-document
          jruby_version="$(docker exec -e JAVA_HOME=/usr/share/logstash/jdk "$container" /usr/share/logstash/vendor/jruby/bin/jruby -e 'print RbConfig::CONFIG["ruby_version"]')"
          gem_path="/root/.local/share/gem/jruby/$jruby_version:/usr/share/logstash/vendor/jruby/lib/ruby/gems/shared:/usr/share/logstash/vendor/bundle/jruby/$jruby_version"
          docker exec -e JAVA_HOME=/usr/share/logstash/jdk -e GEM_PATH="$gem_path" "$container" /usr/share/logstash/vendor/jruby/bin/jruby -S rspec spec
          # High-volume collection against real H2 state (dedupe past 100k rows, window splitting).
          timeout 300s docker exec -e JAVA_HOME=/usr/share/logstash/jdk -e GEM_PATH="$gem_path" -e M365_VOLUME=1 "$container" /usr/share/logstash/vendor/jruby/bin/jruby -S rspec spec --tag volume
          timeout 90s docker exec --user logstash "$container" sh /work/test/integration/run_in_logstash.sh
          docker exec -e JAVA_HOME=/usr/share/logstash/jdk "$container" /usr/share/logstash/bin/logstash-plugin install --no-verify "/work/logstash-input-microsoft365-$PLUGIN_VERSION.gem"
          mkdir -p tmp
          cat > tmp/ci.conf <<'PIPELINE'
          input {
            microsoft365 {
              tenant_id => "00000000-0000-0000-0000-000000000001"
              client_id => "00000000-0000-0000-0000-000000000002"
              client_secret => "configuration-check-only"
              state_path => "/tmp/m365-ci-state"
              collectors => ["signin"]
            }
          }
          output { stdout { codec => rubydebug } }
          PIPELINE
          docker exec -u logstash -e JAVA_HOME=/usr/share/logstash/jdk "$container" /usr/share/logstash/bin/logstash --config.test_and_exit --path.data /tmp/m365-ci-data --path.logs /tmp/m365-ci-logs -f /work/tmp/ci.conf
          mkdir -p tmp/pkg
          cp "logstash-input-microsoft365-$PLUGIN_VERSION.gem" tmp/pkg/
          archive="/work/tmp/pkg/logstash-input-microsoft365-$PLUGIN_VERSION-logstash-${{ matrix.logstash }}-offline.zip"
          docker exec -e JAVA_HOME=/usr/share/logstash/jdk "$container" /usr/share/logstash/bin/logstash-plugin prepare-offline-pack --output "$archive" logstash-input-microsoft365
          docker run -d --name "$offline_container" --user root --network none --entrypoint sleep -v "$PWD:/work" -w /work "docker.elastic.co/logstash/logstash:${{ matrix.logstash }}" infinity
          docker exec -e JAVA_HOME=/usr/share/logstash/jdk "$offline_container" /usr/share/logstash/bin/logstash-plugin install "file://$archive"
          docker exec -u logstash -e JAVA_HOME=/usr/share/logstash/jdk "$offline_container" /usr/share/logstash/bin/logstash --config.test_and_exit --path.data /tmp/m365-offline-ci-data --path.logs /tmp/m365-offline-ci-logs -f /work/tmp/ci.conf
      - uses: actions/upload-artifact@v4
        with:
          name: logstash-input-microsoft365-${{ matrix.logstash }}
          if-no-files-found: error
          path: tmp/pkg/*

  image:
    # Builds and smoke-tests the Dockerfile on every run; pushes the tested image to GHCR only when publishing.
    needs: [powershell, logstash]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - logstash: '8.19.22'
          - logstash: '9.5.4'
            default: true
    steps:
      - uses: actions/checkout@v4
      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^ *s\.version *= *'\(.*\)'$/\1/p" logstash-input-microsoft365.gemspec)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match gemspec version $version" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == 0.* || "$version" =~ [a-zA-Z] ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # <version>-logstash-<logstash>; the default Logstash also gets <version>, and latest for stable releases.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-logstash-${{ matrix.logstash }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ matrix.default == true }}
            type=raw,value=latest,enable=${{ matrix.default == true && steps.version.outputs.prerelease == 'false' }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: LOGSTASH_VERSION=${{ matrix.logstash }}
          load: true
          tags: |
            m365-logstash:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=logstash-${{ matrix.logstash }}
          cache-to: type=gha,mode=max,scope=logstash-${{ matrix.logstash }}
      - name: Test image
        shell: bash
        run: |
          set -euo pipefail
          # A local .gem is unpacked under vendor/local_gems and added to the Gemfile as a path gem,
          # which `logstash-plugin list` doesn't report.
          docker run --rm --entrypoint grep m365-logstash:ci '^gem "logstash-input-microsoft365"' /usr/share/logstash/Gemfile \
            | tee /dev/stderr | grep -F "logstash-input-microsoft365-${{ steps.version.outputs.version }}"
          mkdir -p tmp
          cat > tmp/image.conf <<'PIPELINE'
          input {
            microsoft365 {
              tenant_id => "00000000-0000-0000-0000-000000000001"
              client_id => "00000000-0000-0000-0000-000000000002"
              client_secret => "configuration-check-only"
              state_path => "/usr/share/logstash/data/m365/ci"
              collectors => ["signin"]
            }
          }
          output { stdout { codec => rubydebug } }
          PIPELINE
          docker run --rm -v "$PWD/tmp/image.conf:/usr/share/logstash/pipeline/logstash.conf:ro" --entrypoint /usr/share/logstash/bin/logstash m365-logstash:ci \
            --config.test_and_exit -f /usr/share/logstash/pipeline/logstash.conf
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push image
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r tag; do
            [[ -n "$tag" ]] && docker push "$tag"
          done <<< "$TAGS"

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [powershell, logstash, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: logstash-input-microsoft365-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/^ *s\.version *= *'\(.*\)'$/\1/p" logstash-input-microsoft365.gemspec)"
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match gemspec version $version" >&2
            exit 1
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo
            echo '### Container images'
            echo
            echo 'Official Logstash images with the plugin installed:'
            echo
            for pack in dist/*-offline.zip; do
              ls_version="${pack##*-logstash-}"
              echo "- \`$image:$version-logstash-${ls_version%-offline.zip}\`"
            done
          } >> notes.md
          flags=()
          # 0.x and suffixed versions (1.0.0.rc1) are pre-releases.
          if [[ "$version" == 0.* || "$version" =~ [a-zA-Z] ]]; then flags+=(--prerelease); fi
          # A published release's files are never replaced.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; its files are left unchanged."
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md "${flags[@]}"
          fi

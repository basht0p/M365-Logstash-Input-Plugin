# One input block represents one tenant and owns one checkpoint directory.
input {
  microsoft365 {
    tenant_id => "00000000-0000-0000-0000-000000000000"
    client_id => "11111111-1111-1111-1111-111111111111"
    cloud => "commercial"
    organization_id => "example-org"
    organization_name => "Example Organization"

    certificate_path => "/etc/logstash/secrets/m365-client.pfx"
    certificate_password => "${M365_CERTIFICATE_PASSWORD}"
    state_path => "/var/lib/logstash/m365/example-org"

    collectors => ["activity", "signin", "directory_audit", "defender_alert", "defender_incident", "risk_detection", "risky_user"]
    preserve_original => true
    ecs_compatibility => "v8"
  }
}

output {
  if [event][dataset] == "microsoft365.defender_alert" or [event][dataset] == "microsoft365.defender_incident" or [event][dataset] == "microsoft365.risk_detection" or [event][dataset] == "microsoft365.risky_user" {
    # Mutable source objects: stable entity_id replaces the prior version.
    opensearch {
      hosts => ["https://opensearch.example:9200"]
      index => "m365-current"
      document_id => "%{[@metadata][entity_id]}"
      user => "${OS_USER}"
      password => "${OS_PASSWORD}"
      ssl => true
    }
  } else {
    # Event history: each source identity/version gets a deterministic ID.
    opensearch {
      hosts => ["https://opensearch.example:9200"]
      index => "m365-history-%{+yyyy.MM.dd}"
      document_id => "%{[@metadata][document_id]}"
      user => "${OS_USER}"
      password => "${OS_PASSWORD}"
      ssl => true
    }
  }
}
